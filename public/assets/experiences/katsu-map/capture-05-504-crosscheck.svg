<text x="82" y="23" fill="#8b949e" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13">Sentry 504 집중 구간 ↔ 전후 15분 서버 로그 교차 검증 (2026-07-22)</text>
